# The yardr-telegram bridge as a pack of kind source: imported into the
# yard and into no depot. The bridge is a process of its own on this
# machine (YARDR.md); this pack declares the source the yard talks to it
# through, hears what it relays, and answers through it.
#
#   yardr pack apply <install root>/pack --source-env tgbridge=<file>
#
# The source is named tgbridge, never telegram: yardr's own telegram pack
# is a webhook on the same Bot API, and the two cannot serve one bot.
name: tgbridge
kind: source
setup: SETUP.md

sources:
  tgbridge:
    declaration: tgbridge.yaml
